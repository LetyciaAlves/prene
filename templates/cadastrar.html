<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Lulêh Fitness</title>

    <link rel="stylesheet" href="../static/css/cadastrar.css">

</head>
<body>

    <div class="topo">
        <h1>Sistema de Cadastro</h1>
        <p>Preencha os dados abaixo para realizar o seu cadastro</p>
    </div>

    <div class="menu">

        <div class="botao">
            <a href="/">Home</a>
        </div>

        <div class="botao">
            <a href="/cadastrar">Cadastrar</a>
        </div>

        <div class="botao">
            <a href="/login">Login</a>
        </div>

    </div>

    <div class="cadastro">

        <h2>Cadastro de Usuário</h2>

            <form action="/cadastrar" method="post">
                <label>Nome:</label><br>
                <input type="text" name="nomeusuario"><br>
                <label>E-mail:</label><br>
                <input type="text" name="emailusuario"><br>
                <label>Senha:</label><br>
                <input type="password" name="senhausuario"><br>
                <button type="submit">Cadastrar</button>
            </form>

    </div>

</body>
</html>
